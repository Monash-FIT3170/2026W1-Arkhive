<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arkDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEFF4"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Hexagonal Honeycomb Document Sheet -->
  <polygon points="256,12 476,138 476,374 256,500 36,374 36,138"
           fill="url(#arkDocGrad)" stroke="#2E3440" stroke-width="18"
           stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Document Lines (Left-Aligned Paragraph Hierarchy) -->
  <!-- Title Line: Nord Polar Blue -->
  <rect x="130" y="174" width="160" height="32" rx="16" fill="#5E81AC"/>
  <!-- Body Line: Arctic Cyan -->
  <rect x="130" y="240" width="252" height="32" rx="16" fill="#88C0D0"/>
  <!-- Summary Line: Nord Frost -->
  <rect x="130" y="306" width="190" height="32" rx="16" fill="#81A1C1"/>
</svg>